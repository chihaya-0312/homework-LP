<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Royal mellow</title>
    <link rel="icon" href="img/favicon.png">
    <link rel="stylesheet" href="css/ress.css">
    <link rel="stylesheet" href="css/style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Martel:wght@200;300;400;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body>
    <main>
        <section class="hero"></section>

        <section class="chocolate">
            <section class="syouhin">
                <div class="section-inner syouhin__inner">
                    <h1>ROYAL MELLOW</h1>
                    <img src="img/Royal_mellow_pacege.png" alt="">
                    <p class="setumei">
                        コク深いミルクチョコレートが織りなす贅沢な味わい。<br>
                        一口食べれば、とろけるようなくちどけと豊かな余韻が広がります。
                    </p>
                </div>
            </section>

            <section class="story">
                    <div class="story-visual">
                        <p class="story-copy">ひとくち濃厚、<br>　　あまい幸せ。</p>
                        <div class="story-image story-image--left">
                            <img src="img/chocolate2.png" alt="">
                        </div>
                        <div class="story-image story-image--right">
                            <img src="img/chocolate.png" alt="">
                        </div>
                    </div>
            </section>
        </section>

        <img src="img/choco_bg.png" alt="">
        
        <section class="lineup">
            <div class="section-inner">
                <h2>LINEUP</h2>
                <div class="lineup-grid">
                    <div class="lineup-card">
                        <img src="img/royal_milk.png" alt="「Royal mellow」シリーズ_ロイヤルミルク味">
                    </div>
                    <div class="lineup-card">
                        <img src="img/royal_mattya.png" alt="「Royal mellow」シリーズ_ロイヤル抹茶味">
                    </div>
                    <div class="lineup-card">
                        <img src="img/royal_strawberry.png" alt="「Royal mellow」シリーズ_ロイヤルストロベリー味">
                    </div>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <img src="img/logo.png" alt="Rich The Chocolat">
        <small class="copyright">&copy; 2026 Rich The Chocolat</small>
    </footer>
</body>
</html>
